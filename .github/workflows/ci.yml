name: CI

# ──────────────────────────────────────────────
# TRIGGERS: When should this run?
# ──────────────────────────────────────────────
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Cancel previous runs on the same branch to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────
# PERMISSIONS: Least privilege principle
# ──────────────────────────────────────────────
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Linting + Type Checking
  # (Fast feedback — runs first, fails fast)
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"          # ← automatic pip caching
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Ruff (formatting check)
        run: ruff format --check .

      - name: Run Mypy (type checking)
        run: mypy .

  # ─────────────────────────────────────────────
  # JOB 2: Testing across multiple Python versions
  # (Matrix — verifies compatibility)
  # ─────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # ← don't cancel other versions if one fails
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        # Uncomment to also test on macOS/Windows:
        # include:
        #   - python-version: "3.12"
        #     os: macos-latest
        #   - python-version: "3.12"
        #     os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install package (editable)
        run: pip install -e .

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml --cov-report=term

      # Upload coverage to Codecov (free for open-source)
      # Sign up at codecov.io and add your token as a repo secret
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  # ─────────────────────────────────────────────
  # JOB 3: Security scanning
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run Bandit (code security scan)
        run: bandit -r . -ll || true
        # '|| true' makes it non-blocking (shows warnings without failing CI)
        # Remove '|| true' to make it fail on medium+ severity

      - name: Run pip-audit (dependency vulnerability scan)
        run: pip-audit -r requirements-dev.txt || true
        # Same here — remove '|| true' to enforce strict checks

  # ─────────────────────────────────────────────
  # JOB 4: Build (verify the package builds)
  # ─────────────────────────────────────────────
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7