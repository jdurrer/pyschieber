# pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyschieber"
version = "1.3.3"
description = "pyschieber is a terminal application of the popular swiss card game Schieber and provides an API to the game"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Samuel Kurath", email = "samuel.kurath@gmail.com" },
	{ name = "Jan Durrer", email = "github.semantic922@passmail.com" }
]

keywords = ["schieber", "card-game", "swiss", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
	# Insert dependencies here
	]

# Console script entry point (replaces bin/pyschieber script)
# Uncomment and configure if you want a CLI command like: pyschieber
[project.scripts]
pyschieber = "pyschieber.cli:main"

[project.urls]
Homepage = "https://github.com/jdurrer/pyschieber"
Documentation = "https://github.com/jdurrer/pyschieber#readme"
Repository = "https://github.com/jdurrer/pyschieber.git"
"Bug Tracker" = "https://github.com/jdurrer/pyschieber/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyschieber"]

[tool.hatch.version]
path = "pyschieber/__init__.py"  # Read version from code

# ─────────────────────────────────────────────
# PYTEST CONFIGURATION (only run tests on changed files)
# ─────────────────────────────────────────────

[tool.pytest.ini_options]
addopts = [
    "-v",
    "--tb=short",
    "--color=yes",
]
testpaths = ["tests"]

# Testmon configuration (tracks test/file relationships)
[tool.testmon]
path = ".tmonrc"

# ─────────────────────────────────────────────
# RUFF CONFIGURATION (replaces ruff, isort, black settings)
# ─────────────────────────────────────────────
[tool.ruff]
# Same as Black's default line length
line-length = 88

# Target Python version (affects which syntax/features are valid)
target-version = "py39"

# Exclude directories from linting/formatting
extend-exclude = [
    "__pycache__",
    ".eggs",
    "*.egg-info",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# ─────────────────────────────────────────────
# LINTING RULES (replaces flake8/pylint)
# ─────────────────────────────────────────────
[tool.ruff.lint]
# Select rule categories (uppercase = error, lowercase = warning)
# See: https://beta.ruff.rs/docs/rules/
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # Pyflakes (imports, undefined names, etc.)
    "I",        # isort (import ordering)
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "UP",       # pyupgrade (modernize syntax)
    "ARG",      # unused arguments
    "DTZ",      # datetime rules
    "TCH",      # type-checking blocks
    "PERF",     # performance antipatterns
    "RUF",      # ruff-specific rules
]

ignore = [
    "E501",     # Line too long (let formatter handle this)
    "ANN",      # Missing type annotations (handled by mypy separately)
    "COM812",   # Missing trailing comma (formatter manages this)
    "ISC001",   # Implicit string concatenation (formatter manages this)
    "S101",     # assert statements (allowed in tests)
]

# Per-file rule overrides
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T201"]
"__init__.py" = ["F401"]

# ─────────────────────────────────────────────
# FORMATTING RULES (replaces Black + isort)
# ─────────────────────────────────────────────
[tool.ruff.format]
quote-style = "double"           # Match Black's default
indent-style = "space"           # Match Black's default
line-ending = "auto"             # Use platform default
docstring-code-format = true     # Format code in docstrings

# ─────────────────────────────────────────────
# TYPE CHECKING CONFIG
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.9"
strict = true                    # Enable all strict mode flags
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# Handle missing type stubs for external libs
[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "matplotlib.*",
]
ignore_missing_imports = true